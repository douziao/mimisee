{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mimisee.fullname" . }}-migrate
  labels:
    {{- include "mimisee.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "mimisee.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      {{- with .Values.migrations.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- include "mimisee.podSecurityContext" (dict "root" . "extra" .Values.migrations.podSecurityContext) | nindent 6 }}
      {{- include "mimisee.automountServiceAccountToken" (dict "root" . "override" .Values.migrations.automountServiceAccountToken) | nindent 6 }}
      {{- include "mimisee.serviceAccountNameBlock" . | nindent 6 }}
      {{- include "mimisee.imagePullSecretsBlock" . | nindent 6 }}
      {{- if .Values.migrations.priorityClassName }}
      priorityClassName: {{ .Values.migrations.priorityClassName | quote }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "mimisee.secretName" . }}
          {{- with .Values.migrations.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "mimisee.containerSecurityContext" (dict "root" . "extra" .Values.migrations.securityContext) | nindent 10 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.security.tmpEmptyDir.enabled }}
            - name: tmp
              mountPath: {{ default "/tmp" .Values.security.tmpEmptyDir.mountPath | quote }}
            {{- end }}
      volumes:
        {{- if .Values.security.tmpEmptyDir.enabled }}
        - name: tmp
          {{- if .Values.security.tmpEmptyDir.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.security.tmpEmptyDir.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
